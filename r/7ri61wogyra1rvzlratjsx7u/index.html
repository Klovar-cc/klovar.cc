<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plex Requests</title>
  <meta name="description" content="Submit a request.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#12110f">
  <meta property="og:title" content="Plex Requests">
  <meta property="og:description" content="Submit a request.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Plex Requests">
  <meta name="twitter:description" content="Submit a request.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --bg: #12110f;
      --fg: #f4f0e8;
      --muted: #9c968c;
      --card: #1c1b18;
      --line: rgba(244, 240, 232, 0.12);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100% - 2rem, 42rem);
      margin-inline: auto;
      padding-top: max(2.25rem, env(safe-area-inset-top));
      padding-bottom: max(2.75rem, env(safe-area-inset-bottom));
    }

    header {
      margin-bottom: 2.25rem;
    }

    .wordmark {
      display: inline-block;
      color: inherit;
      text-decoration: none;
      font-weight: 500;
      font-size: clamp(1.75rem, 6vw, 2.25rem);
      letter-spacing: -0.03em;
      line-height: 1;
    }

    h1 {
      margin: 0 0 0.4rem;
      font-weight: 500;
      font-size: clamp(1.85rem, 7vw, 2.6rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .lede {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      padding: 0.7rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    iframe {
      display: block;
      width: 100%;
      height: min(70dvh, 52rem);
      min-height: 28rem;
      border: 0;
      border-radius: 0.85rem;
      background: #fff;
    }

    .fallback {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.7rem 1rem;
      margin: 1.25rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
    }

    .button {
      display: inline-block;
      padding: 0.65rem 1.15rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--fg);
      text-decoration: none;
      line-height: 1;
    }

    .button:hover {
      background: rgba(244, 240, 232, 0.07);
    }

    .wordmark:hover,
    .button:hover { color: var(--fg); }

    a:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 3px;
    }

    @media (max-width: 40rem) {
      .page { width: min(100% - 1.5rem, 42rem); }

      .card { padding: 0.5rem; border-radius: 1rem; }

      iframe {
        min-height: 24rem;
        height: min(75dvh, 46rem);
        border-radius: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="wordmark" href="/">Klovar</a>
    </header>
    <main>
      <h1>Plex Requests</h1>
      <p class="lede">Something you'd like added? Drop it here.</p>
      <div class="card">
        <iframe
          src="https://docs.google.com/forms/d/1QpxVPqVCPK6YRi7rLEBviDouRKKMJNvzdN6FpTC5EE8/viewform?embedded=true"
          title="Request form"
          width="640"
          height="900">
          Loading…
        </iframe>
      </div>
      <p class="fallback">
        <a class="button" href="https://forms.gle/A5eKtKpxKZ9jBR9H9">Open the form</a>
        <span>if it doesn’t load here.</span>
      </p>
    </main>
  </div>
</body>
</html>
