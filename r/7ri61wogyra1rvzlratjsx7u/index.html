<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klovar's Plex Requests</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      color-scheme: dark;
      --bg: #12110f;
      --fg: #f4f0e8;
      --muted: #9c968c;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100% - 2rem, 42rem);
      margin-inline: auto;
      padding-top: max(2.5rem, env(safe-area-inset-top));
      padding-bottom: max(3rem, env(safe-area-inset-bottom));
    }

    h1 {
      margin: 0 0 0.35rem;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-weight: 500;
      font-size: clamp(1.75rem, 6vw, 2.25rem);
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .lede {
      margin: 0 0 0.35rem;
      color: var(--muted);
    }

    iframe {
      display: block;
      width: 100%;
      height: 900px;
      border: 0;
      border-radius: 12px;
      background: #fff;
    }

    .fallback {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    a { color: var(--fg); }

    a:hover { color: var(--muted); }

    a:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Klovar's Plex Requests</h1>
    <p class="lede">Want something added to Plex? Drop it here.</p>
    <p class="fallback"><a href="https://forms.gle/A5eKtKpxKZ9jBR9H9">Open the form</a> if it doesn’t load here.</p>
    <iframe
      src="https://docs.google.com/forms/d/1QpxVPqVCPK6YRi7rLEBviDouRKKMJNvzdN6FpTC5EE8/viewform?embedded=true"
      title="Plex request form"
      width="640"
      height="900">
      Loading…
    </iframe>
  </main>
</body>
</html>
